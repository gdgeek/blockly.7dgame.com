server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite entry HTML contains the current hashed asset names. It must always
    # be revalidated so an older tab cannot point at files removed by a newer
    # container image.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }

    # Hashed Vite assets are content-addressed and safe to cache permanently.
    # Missing hashes must remain a real 404 instead of falling back to HTML.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The editor is an SPA. Root and fallback responses carry the same entry
    # cache policy as /index.html, including requests with cache-bust queries.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }
}
